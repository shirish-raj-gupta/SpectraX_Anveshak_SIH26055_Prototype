# Keep the ANVESHAK demo awake on Streamlit Community Cloud.
#
# Community Cloud suspends an app that receives no viewer traffic, and nothing
# inside app.py can prevent that -- the sleep is decided by the host, not the
# process. When asleep, Streamlit Cloud displays a modal with:
# "This app has gone to sleep due to inactivity" and a wake button:
# "Yes, get this app back up!".
#
# A simple curl GET cannot click this button and does not establish a
# WebSocket connection (meaning Community Cloud never resets its inactivity
# timer). This workflow runs a headless browser via Playwright:
# 1. Navigates to the deployed app URL.
# 2. If asleep, clicks "Yes, get this app back up!" and waits for container boot.
# 3. If awake, holds an active WebSocket session to refresh the inactivity timer.
#
# SETUP (optional override): add the app URL as a repository variable or secret
# named STREAMLIT_APP_URL under Settings > Secrets and variables > Actions.
# If unset, it defaults to the deployed prototype URL.

name: Keep demo awake

on:
  schedule:
    # Every three hours. Community Cloud's inactivity window is longer than this,
    # and running every 3 hours leaves ample margin for GitHub Actions delays.
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    name: wake-and-keep-alive
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Playwright
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wake and ping demo
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL || secrets.STREAMLIT_APP_URL || 'https://spectrax-anveshak-sih26055-prototype.streamlit.app/' }}
        run: |
          python scripts/keep_awake.py --url "$APP_URL"
